vision_encoder:
  model_name: openai/clip-vit-base-patch32
  select_layer: -2
  select_feature: patch
language_model:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
connector: {}
data:
  train_data_path: datasets/llava_recap_full/train.json
  image_dir: datasets/llava_recap_full/images
  max_length: 384
training:
  output_dir: ./checkpoints/basic-connector-full
  num_epochs: 1
  per_device_batch_size: 24
  gradient_accumulation_steps: 2
  learning_rate: 0.002
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  dataloader_num_workers: 8
  logging_steps: 50
  save_steps: 1000
  seed: 42
